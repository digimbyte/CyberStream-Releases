name: Publish submitted CyberStream release

on:
  push:
    branches:
      - "incoming/**"

permissions:
  contents: write

concurrency:
  group: cyberstream-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out submitted release
        uses: actions/checkout@v4

      - name: Verify submission
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(jq -er '.tag' release.json)"
          version="$(jq -er '.version' release.json)"
          asset="$(jq -er '.asset' release.json)"
          expected_sha="$(jq -er '.sha256' release.json)"

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$version" == "${tag#v}" ]]
          [[ "$asset" == "CyberStreamPlayer.exe" ]]
          [[ "$GITHUB_REF_NAME" == "incoming/$tag" ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{64}$ ]]
          echo "$expected_sha  $asset" | sha256sum --check --strict -

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" \
            'CyberStreamPlayer.exe#CyberStreamPlayer.exe' \
            --repo "$GITHUB_REPOSITORY" \
            --target master \
            --title "CyberStream Player $TAG" \
            --notes "CyberStream Player $TAG. The client verifies this release asset before applying an update." \
            --latest

      - name: Remove processed submission branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME"
